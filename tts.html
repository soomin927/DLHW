<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM TTS App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050714;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Starry Canvas overlay styling */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(147, 197, 253, 0.2);
            color: #f1f5f9;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: rgba(167, 139, 250, 0.6);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.25);
            outline: none;
        }

        /* Accent Tab Button styling */
        .accent-btn {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accent-btn.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(168, 85, 247, 0.4));
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            color: #ffffff;
        }

        /* Audio Visualizer Wave Glow */
        .audio-wave-bar {
            transition: height 0.1s ease;
            background: linear-gradient(to top, #6366f1, #a855f7, #ec4899);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(147, 197, 253, 0.3);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(147, 197, 253, 0.5);
        }

        /* Custom Range Input */
        input[type="range"] {
            accent-color: #a855f7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-purple-500 selection:text-white">

    <canvas id="starCanvas"></canvas>

    <header class="relative z-10 w-full pt-8 pb-4 px-4 text-center">
        <div class="inline-flex items-center gap-3 mb-2">
            <i class="fa-solid me-1 fa-stars text-purple-300 text-2xl animate-pulse"></i>
            <h1 class="text-3xl md:text-5xl font-bold font-cinzel tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-200 via-indigo-200 to-purple-300 drop-shadow-md">
                SSM TTS APP
            </h1>
            <i class="fa-solid fa-moon text-indigo-300 text-2xl animate-pulse"></i>
        </div>
        <p class="text-xs md:text-sm text-slate-400 max-w-md mx-auto font-light tracking-wide">
            밤하늘의 은은한 별빛 아래에서 글을 미국 및 영국식 억양의 오디오로 감상해보세요.
        </p>
    </header>

    <main class="relative z-10 container mx-auto px-4 py-4 max-w-4xl flex-grow flex flex-col gap-6">

        <!-- Top Control Bar: Accent Selection -->
        <div class="glass-panel p-3 md:p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span class="text-xs text-indigo-300 font-semibold uppercase tracking-wider px-2">Accent:</span>
                <div class="grid grid-cols-2 gap-2 w-full sm:w-auto flex-grow">
                    <button id="btnUS" onclick="selectAccent('us')" class="accent-btn active border border-white/10 px-4 py-2 rounded-xl flex items-center justify-center gap-2 text-sm font-medium hover:border-purple-400/50">
                        <span class="text-base">🇺🇸</span> 미국식 (US)
                    </button>
                    <button id="btnUK" onclick="selectAccent('uk')" class="accent-btn border border-white/10 px-4 py-2 rounded-xl flex items-center justify-center gap-2 text-sm font-medium hover:border-purple-400/50">
                        <span class="text-base">🇬🇧</span> 영국식 (UK)
                    </button>
                </div>
            </div>

            <!-- Detailed Voice Dropdown -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-microphone-lines text-purple-400 text-sm"></i>
                <select id="voiceSelect" class="glass-input text-xs md:text-sm rounded-xl px-3 py-2 w-full sm:w-60 focus:ring-1 focus:ring-purple-400">
                    <option value="">음성을 불러오는 중...</option>
                </select>
            </div>
        </div>

        <!-- Text Input Area -->
        <div class="glass-panel p-5 rounded-2xl flex flex-col gap-3 relative overflow-hidden group">
            <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                <label for="textInput" class="font-medium flex items-center gap-2 text-indigo-200">
                    <i class="fa-regular fa-pen-to-square"></i> 변환할 텍스트 입력
                </label>
                <div class="flex items-center gap-3">
                    <button onclick="clearText()" class="hover:text-pink-400 transition-colors title='초기화'">
                        <i class="fa-solid fa-trash-can"></i> 지우기
                    </button>
                    <span id="charCount" class="text-slate-500">0 자</span>
                </div>
            </div>

            <textarea id="textInput" rows="6" 
                class="glass-input w-full p-4 rounded-xl text-base md:text-lg resize-none placeholder-slate-500 focus:outline-none"
                placeholder="여기에 음성으로 변환할 문장을 입력하세요... (예: Welcome to the starry night. Experience English in both US and UK accents.)"
            ></textarea>

            <!-- Audio Waveform Visualizer simulation while playing -->
            <div id="visualizer" class="h-8 flex items-center justify-center gap-1 opacity-30 transition-opacity duration-300">
                <div class="audio-wave-bar w-1 h-2 rounded-full"></div>
                <div class="audio-wave-bar w-1 h-4 rounded-full"></div>
                <div class="audio-wave-bar w-1 h-7 rounded-full"></div>
                <div class="audio-wave-bar w-1 h-3 rounded-full"></div>
                <div class="audio-wave-bar w-1 h-8 rounded-full"></div>
                <div class="audio-wave-bar w-1 h-5 rounded-full"></div>
                <div class="audio-wave-bar w-1 h-2 rounded-full"></div>
            </div>
        </div>

        <!-- Audio Settings and Controls -->
        <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6">
            <!-- Sliders for Pitch and Rate -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full md:w-2/3">
                <!-- Speed / Rate Slider -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-gauge-high text-indigo-400"></i> 속도 (Speed)</span>
                        <span id="rateVal" class="text-purple-300 font-mono">1.0x</span>
                    </div>
                    <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1" 
                           class="w-full h-1.5 bg-slate-700/60 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Pitch Slider -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-sliders text-indigo-400"></i> 음높이 (Pitch)</span>
                        <span id="pitchVal" class="text-purple-300 font-mono">1.0</span>
                    </div>
                    <input type="range" id="pitch" min="0.5" max="1.5" value="1" step="0.1" 
                           class="w-full h-1.5 bg-slate-700/60 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <!-- Action Buttons: Play/Pause, Stop -->
            <div class="flex items-center justify-center gap-3 w-full md:w-auto">
                <button id="btnStop" onclick="stopAudio()" 
                        class="p-3 bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 rounded-xl transition-all duration-200 active:scale-95 disabled:opacity-40" 
                        title="정지" disabled>
                    <i class="fa-solid fa-stop text-lg"></i>
                </button>

                <button id="btnPlay" onclick="togglePlay()" 
                        class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-medium rounded-xl shadow-lg shadow-purple-900/30 flex items-center gap-2 transition-all duration-200 active:scale-95 hover:shadow-purple-500/20">
                    <i id="playIcon" class="fa-solid fa-play"></i>
                    <span id="playText">재생하기</span>
                </button>
            </div>
        </div>

    </main>

    <footer class="relative z-10 w-full py-4 text-center text-xs text-slate-500">
        <p>SSM TTS App • Powered by Web Speech API</p>
    </footer>

    <script>
        /* -------------------------------------------------------------
         * 1. Starfield Visual Effect Engine
         * ------------------------------------------------------------- */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let numStars = 180;
        let isAudioPlaying = false;
        let animationFrameId;

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.baseAlpha = Math.random() * 0.7 + 0.2;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleFactor = Math.random() * Math.PI;
                this.color = this.getRandomColor();
            }

            getRandomColor() {
                const colors = ['#ffffff', '#cbd5e1', '#a7f3d0', '#bae6fd', '#ddd6fe', '#fbcfe8'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.twinkleFactor += this.twinkleSpeed;
                // Twinkle effect
                let pulseMultiplier = isAudioPlaying ? 1.8 : 1.0;
                this.alpha = this.baseAlpha + Math.sin(this.twinkleFactor) * 0.3 * pulseMultiplier;
                
                // Clamp alpha between 0 and 1
                this.alpha = Math.max(0.1, Math.min(1, this.alpha));
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, isAudioPlaying ? this.size * 1.3 : this.size, 0, Math.PI * 2);
                ctx.fill();

                // Glow effect for bigger stars
                if (this.size > 1.2) {
                    ctx.shadowBlur = isAudioPlaying ? 12 : 6;
                    ctx.shadowColor = this.color;
                }
                ctx.restore();
            }
        }

        function initStars() {
            stars = [];
            numStars = Math.floor((canvas.width * canvas.height) / 5000);
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw subtle background nebula glow
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 100,
                canvas.width / 2, canvas.height / 2, canvas.width
            );
            gradient.addColorStop(0, 'rgba(30, 27, 75, 0.4)');
            gradient.addColorStop(0.5, 'rgba(15, 23, 42, 0.6)');
            gradient.addColorStop(1, 'rgba(5, 7, 20, 0.95)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            animationFrameId = requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateStars();


        /* -------------------------------------------------------------
         * 2. Web Speech Synthesis & Voice Control Logic
         * ------------------------------------------------------------- */
        const synth = window.speechSynthesis;
        let voices = [];
        let selectedAccent = 'us'; // Default accent: 'us' or 'uk'
        let currentUtterance = null;

        // DOM Elements
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const rateInput = document.getElementById('rate');
        const pitchInput = document.getElementById('pitch');
        const rateVal = document.getElementById('rateVal');
        const pitchVal = document.getElementById('pitchVal');
        const charCount = document.getElementById('charCount');
        const btnPlay = document.getElementById('btnPlay');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const btnStop = document.getElementById('btnStop');
        const visualizer = document.getElementById('visualizer');

        // Populate available voices and filter based on selection
        function populateVoiceList() {
            voices = synth.getVoices();
            filterVoices();
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoiceList;
        }

        // Filter voices based on Accent (US or UK)
        function filterVoices() {
            voiceSelect.innerHTML = '';
            
            const targetLang = selectedAccent === 'us' ? 'en-US' : 'en-GB';
            const filteredVoices = voices.filter(v => v.lang.replace('_', '-').includes(targetLang));

            if (filteredVoices.length === 0) {
                // Fallback to any English voice if specific accent is missing
                const fallbackVoices = voices.filter(v => v.lang.startsWith('en'));
                if (fallbackVoices.length === 0) {
                    const opt = document.createElement('option');
                    opt.textContent = '지원하는 영어 음성을 찾을 수 없습니다';
                    voiceSelect.appendChild(opt);
                    return;
                }
                fallbackVoices.forEach(voice => appendVoiceOption(voice));
            } else {
                filteredVoices.forEach(voice => appendVoiceOption(voice));
            }
        }

        function appendVoiceOption(voice) {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.setAttribute('data-lang', voice.lang);
            option.setAttribute('data-name', voice.name);
            voiceSelect.appendChild(option);
        }

        // Accent Selection Handler
        function selectAccent(accent) {
            selectedAccent = accent;
            document.getElementById('btnUS').classList.toggle('active', accent === 'us');
            document.getElementById('btnUK').classList.toggle('active', accent === 'uk');
            
            filterVoices();

            // If speaking, restart with new accent settings
            if (synth.speaking) {
                stopAudio();
                togglePlay();
            }
        }

        // Toggle Play / Pause / Resume
        function togglePlay() {
            const text = textInput.value.trim();
            if (!text) {
                textInput.focus();
                textInput.classList.add('border-red-400');
                setTimeout(() => textInput.classList.remove('border-red-400'), 1500);
                return;
            }

            if (synth.speaking) {
                if (synth.paused) {
                    synth.resume();
                    setUIStateSpeaking();
                } else {
                    synth.pause();
                    setUIStatePaused();
                }
            } else {
                startSpeaking(text);
            }
        }

        function startSpeaking(text) {
            synth.cancel(); // Stop prior speeches

            currentUtterance = new SpeechSynthesisUtterance(text);

            // Select Voice
            const selectedOption = voiceSelect.selectedOptions[0];
            if (selectedOption) {
                const selectedName = selectedOption.getAttribute('data-name');
                const matchedVoice = voices.find(v => v.name === selectedName);
                if (matchedVoice) currentUtterance.voice = matchedVoice;
            }

            // Set rate & pitch
            currentUtterance.rate = parseFloat(rateInput.value);
            currentUtterance.pitch = parseFloat(pitchInput.value);

            // Event Handlers
            currentUtterance.onstart = () => {
                setUIStateSpeaking();
            };

            currentUtterance.onend = () => {
                setUIStateStopped();
            };

            currentUtterance.onerror = (e) => {
                console.error('Speech synthesis error:', e);
                setUIStateStopped();
            };

            synth.speak(currentUtterance);
        }

        function stopAudio() {
            synth.cancel();
            setUIStateStopped();
        }

        /* -------------------------------------------------------------
         * 3. UI State Updates & Animations
         * ------------------------------------------------------------- */
        let visualizerInterval;

        function setUIStateSpeaking() {
            isAudioPlaying = true;
            playIcon.className = 'fa-solid fa-pause';
            playText.textContent = '일시정지';
            btnStop.disabled = false;
            visualizer.classList.remove('opacity-30');
            visualizer.classList.add('opacity-100');

            // Animate waveform bars
            clearInterval(visualizerInterval);
            const bars = document.querySelectorAll('.audio-wave-bar');
            visualizerInterval = setInterval(() => {
                bars.forEach(bar => {
                    const h = Math.floor(Math.random() * 24) + 6;
                    bar.style.height = `${h}px`;
                });
            }, 120);
        }

        function setUIStatePaused() {
            isAudioPlaying = false;
            playIcon.className = 'fa-solid fa-play';
            playText.textContent = '재개하기';
            visualizer.classList.add('opacity-30');
            clearInterval(visualizerInterval);
        }

        function setUIStateStopped() {
            isAudioPlaying = false;
            playIcon.className = 'fa-solid fa-play';
            playText.textContent = '재생하기';
            btnStop.disabled = true;
            visualizer.classList.add('opacity-30');
            clearInterval(visualizerInterval);

            // Reset visualizer bars
            const bars = document.querySelectorAll('.audio-wave-bar');
            bars.forEach(bar => bar.style.height = '8px');
        }

        function clearText() {
            textInput.value = '';
            charCount.textContent = '0 자';
            if (synth.speaking) stopAudio();
        }

        // Input & Range Listeners
        textInput.addEventListener('input', () => {
            charCount.textContent = `${textInput.value.length} 자`;
        });

        rateInput.addEventListener('input', (e) => {
            rateVal.textContent = `${parseFloat(e.target.value).toFixed(1)}x`;
        });

        pitchInput.addEventListener('input', (e) => {
            pitchVal.textContent = parseFloat(e.target.value).toFixed(1);
        });

        // Initialize Voices on Load
        window.addEventListener('load', () => {
            populateVoiceList();
            // Default sample text
            textInput.value = "Hello! Welcome to the starry night. You can listen to this text in both American and British accents.";
            charCount.textContent = `${textInput.value.length} 자`;
        });
    </script>
</body>
</html>
